name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  test-release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: "TDS identity: 24f2005960@ds.study.iitm.ac.in"
        run: echo "TDS identity verified"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flask
        run: pip install flask

      - name: Test release gate
        run: |
          python -m py_compile app.py
