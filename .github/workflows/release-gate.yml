name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  test-release-gate:
    runs-on: ubuntu-latest

    steps:
      steps:
  - name: "TDS identity: 24f2005960@ds.study.iitm.ac.in"
    run: echo "TDS identity verified"

  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
        run: echo "TDS identity verified"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API
        run: |
          python app.py > server.log 2>&1 &
          sleep 3

      - name: Test safe production request
        run: |
          python - <<'PY'
          import json
          import urllib.request

          payload = {
              "target": "production",
              "event": "push",
              "ref": "refs/heads/main",
              "workflow": {
                  "trigger": "push",
                  "permissions": {
                      "contents": "read",
                      "packages": "write",
                      "id-token": "none"
                  },
                  "testsPassed": True,
                  "matrixComplete": True,
                  "failFast": False,
                  "environmentApproval": True,
                  "actions": [
                      {
                          "owner": "actions",
                          "name": "checkout",
                          "ref": "v4"
                      }
                  ]
              },
              "image": {
                  "multiStage": True,
                  "runsAsRoot": False,
                  "secretMode": "none",
                  "criticalVulnerabilities": 0,
                  "digestPinned": True
              }
          }

          request = urllib.request.Request(
              "http://127.0.0.1:5000/release-gate",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read())

          print(result)

          assert result["decision"] == "promote"
          assert result["violations"] == []
          PY

      - name: Test blocked request
        run: |
          python - <<'PY'
          import json
          import urllib.request

          payload = {
              "target": "production",
              "event": "pull_request",
              "ref": "refs/heads/feature",
              "workflow": {
                  "trigger": "pull_request_target",
                  "permissions": {
                      "contents": "write",
                      "packages": "write",
                      "id-token": "write"
                  },
                  "testsPassed": False,
                  "matrixComplete": False,
                  "failFast": True,
                  "actions": [
                      {
                          "owner": "someone",
                          "name": "some-action",
                          "ref": "v1"
                      }
                  ]
              },
              "image": {
                  "multiStage": False,
                  "runsAsRoot": True,
                  "secretMode": "copy",
                  "criticalVulnerabilities": 2,
                  "digestPinned": False
              }
          }

          request = urllib.request.Request(
              "http://127.0.0.1:5000/release-gate",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read())

          print(result)

          expected = {
              "EXCESS_PERMISSION",
              "SINGLE_STAGE_IMAGE",
              "ROOT_RUNTIME",
              "SECRET_IN_LAYER",
              "CRITICAL_CVE",
              "UNPINNED_IMAGE",
              "INVALID_PRODUCTION_REF",
              "APPROVAL_REQUIRED",
              "TESTS_INCOMPLETE",
              "UNSAFE_PR_TRIGGER",
              "MUTABLE_ACTION"
          }

          assert result["decision"] == "block"
          assert set(result["violations"]) == expected
          PY
